monolog:
    channels:
        - rest
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                channels: ["!event", "!rest"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            rest_log:
                type: stream
                path: php://stderr
                level: debug
                channels: [ "rest" ]
when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: main_output
                excluded_http_codes: [404, 405]
                channels: ["!event", "!rest"]
            main_output:
                type: stream
                path: php://stderr
                level: debug
            rest_log:
                type: stream
                path: php://stderr
                level: debug
                channels: [ "rest" ]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: main_output
                excluded_http_codes: [404, 405]
                buffer_size: 50
                channels: ["!event", "!rest", "!deprecation"]

            main_output:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

            rest:
                type: stream
                path: php://stderr
                level: debug
                channels: ["rest"]
                formatter: monolog.formatter.json

            deprecation:
                type: stream
                path: php://stderr
                level: notice
                channels: ["deprecation"]
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!rest", "!deprecation"]
