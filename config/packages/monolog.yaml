monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: main_output
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            main_output:
                type: stream
                path: php://stderr
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: main_output
                excluded_http_codes: [404, 405]
                buffer_size: 50
                channels: ["!event", "!deprecation"]

            main_output:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json

            deprecation:
                type: stream
                path: php://stderr
                level: notice
                channels: ["deprecation"]
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]
