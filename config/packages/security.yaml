security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
#    password_hashers:
#        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Security\UserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        secured:
          pattern: ^/oauth2/auth
          custom_authenticators:
            - App\Security\AuthorizationEndpointAuthenticator
          entry_point: App\Security\AuthorizationEndpointAuthenticator

        access_token:
          pattern: ^/
          stateless: true
          access_token:
            token_handler: sgoranov\IdentityLinkShared\Security\AccessTokenHandler

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
         - { path: ^/.well-known/openid-configuration, roles: PUBLIC_ACCESS }
         - { path: ^/oauth2/auth$, roles: PUBLIC_ACCESS }
         - { path: ^/oauth2/token, roles: PUBLIC_ACCESS }
         - { path: ^/login, roles: PUBLIC_ACCESS }
         - { path: ^/jwks, roles: PUBLIC_ACCESS }
         - { path: ^/switch-locale, roles: PUBLIC_ACCESS }
         - { path: ^/api/v1/ping, roles: PUBLIC_ACCESS }

         - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

