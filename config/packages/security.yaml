security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
#    password_hashers:
#        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            id: App\Security\UserProvider
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        access_token:
          pattern: ^/
          stateless: true
          # Not called on every request, only when access_control denies a request that carries no bearer token. It
          # answers 401 with "WWW-Authenticate: Bearer". A request with an invalid token is answered by access_token.
          entry_point: App\Security\BearerAuthenticationEntryPoint
          access_token:
            token_handler: App\Security\AccessTokenHandler

    # Note: Only the *first* matching rule is applied
    access_control:
         - { path: ^/.well-known/openid-configuration, roles: PUBLIC_ACCESS }
         # The authorization and login routes are guarded by the state of their AuthorizationSession (see AuthorizationFlow)
         - { path: ^/oauth2/auth, roles: PUBLIC_ACCESS }
         - { path: ^/oauth2/token, roles: PUBLIC_ACCESS }
         - { path: ^/login, roles: PUBLIC_ACCESS }
         - { path: ^/jwks, roles: PUBLIC_ACCESS }
         - { path: ^/switch-locale, roles: PUBLIC_ACCESS }
         - { path: ^/api/v1/ping, roles: PUBLIC_ACCESS }

         - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

