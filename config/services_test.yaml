parameters:
    jwt_key:
        kid: '5eda9b41-085c-403f-85e7-50d3b4131082'
        public: 'file://%kernel.project_dir%/tests/resources/public.key'
        private: 'file://%kernel.project_dir%/tests/resources/private.key'
    encryption_key: '%kernel.project_dir%/tests/resources/encryption.key'
    access_token_ttl: PT1H
    refresh_token_ttl: P1M
    auth_code_ttl: PT1M
    enable_client_credentials_grant: true
    enable_password_grant: true
    enable_refresh_token_grant: true
    enable_auth_code_grant: true
    enable_implicit_grant: false

services:
    _defaults:
        public: true

    App\Tests\Helper\TestHelper:
        arguments:
            - '@App\Api\Contract\ClientConnectorInterface'
            - '@App\Api\Contract\UserConnectorInterface'
            - '@App\Service\JwtTokenGenerator'

    App\Repository\ScopeRepository:
        public: true

    App\Api\Contract\UserConnectorInterface:
        class: App\Tests\Helper\Mocks\UserConnectorMock

    App\Api\Contract\ClientConnectorInterface:
        class: App\Tests\Helper\Mocks\ClientConnectorMock
