version: '3.5'
services:

  core:
    container_name: core
    privileged: true
    build:
      context: ${PHP_IDENTITY_LINK_SOURCE_DIR}
    ports:
      - 9000:80
    volumes:
      - ${PHP_IDENTITY_LINK_SOURCE_DIR}:/var/www
    environment:
      PGHOST: database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PHP_IDENTITY_LINK_TEST_DATA_GENERATION: ${PHP_IDENTITY_LINK_TEST_DATA_GENERATION}
      PHP_IDENTITY_LINK_TEST_DATA_CLIENT_ID: ${PHP_IDENTITY_LINK_TEST_DATA_CLIENT_ID}
      PHP_IDENTITY_LINK_TEST_DATA_CLIENT_SECRET: ${PHP_IDENTITY_LINK_TEST_DATA_CLIENT_SECRET}
      PHP_IDENTITY_LINK_TEST_DATA_REDIRECT_URI: ${PHP_IDENTITY_LINK_TEST_DATA_REDIRECT_URI}
      PHP_IDENTITY_LINK_TEST_DATA_USER_NAME: ${PHP_IDENTITY_LINK_TEST_DATA_USER_NAME}
      PHP_IDENTITY_LINK_TEST_DATA_USER_PASS: ${PHP_IDENTITY_LINK_TEST_DATA_USER_PASS}
      PHP_IDENTITY_LINK_TEST_DATA_GROUP_NAME: ${PHP_IDENTITY_LINK_TEST_DATA_GROUP_NAME}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
    depends_on:
      - database-server
    networks:
      - my-network

  database-server:
    container_name: database-server
    image: postgres:10
    restart: always
    ports:
      - "9006:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - my-network

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: database-server
    ports:
      - 9005:8080
    networks:
      - my-network

  smtp-server:
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - 9025:1025 # smtp server
      - 9026:8025 # web ui
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
